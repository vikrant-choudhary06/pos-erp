appId: in.rizzoto.pos
productName: Rizzoto
copyright: Rizzoto
directories:
  output: release
files:
  - dist/**
  - '!dist/hub-cli.*'
  - '!dist/**/*.map'
  - assets/**
  - package.json
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Rizzoto-Setup-${version}.${ext}
# Writes latest.yml next to the installer, which installed apps read to find
# new versions. Where they look is baked in by build.mjs, see src/updates.ts;
# CI uploads the files (scripts/publish-update.sh).
publish:
  provider: generic
  url: https://updates.invalid
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Rizzoto
