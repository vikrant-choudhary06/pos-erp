appId: in.rizzoto.pos
productName: Rizzoto
copyright: Rizzoto
directories:
  output: release
files:
  - dist/**
  - '!dist/hub-cli.*'
  - '!dist/**/*.map'
  - assets/**
  - package.json
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Rizzoto-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Rizzoto
