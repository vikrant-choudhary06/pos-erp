name: Deploy web to Cloudflare

# Needs, under Settings → Secrets and variables → Actions:
#   secrets  CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers")
#            CLOUDFLARE_ACCOUNT_ID
#   variable API_URL               e.g. https://api.rizzoto.in, baked into the build
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/shared/**", "pnpm-lock.yaml"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Skip until Cloudflare is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$API_URL" ]; then
            echo "CLOUDFLARE_API_TOKEN or API_URL missing, nothing to deploy"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.ready.outputs.go == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.ready.outputs.go == 'true'
        run: pnpm --filter web cf:build
      - if: steps.ready.outputs.go == 'true'
        run: pnpm --filter web cf:deploy
